name: habit_idea_tracker
description: A habit and idea tracker app with local storage and API integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.2
  
  # Local storage
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Networking
  http: ^1.3.0
  
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  
  # UI
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/